<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bottle Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="lab.css" />
  </head>
  <body class="lab">
    <aside class="ui lab-panel">
      <h1>Bottle lab</h1>
      <p class="lab-hint">Three 3D bottles in the real scene.</p>
      <p class="lab-label">Pose</p>
      <div class="lab-choices" data-group="pose">
        <button type="button" data-value="shelf">Shelf</button>
        <button type="button" data-value="pour">Pour</button>
      </div>
    </aside>
    <script type="module" src="bottle-lab.js"></script>
  </body>
</html>
