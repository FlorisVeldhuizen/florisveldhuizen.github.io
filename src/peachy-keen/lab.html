<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingerie Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="lab.css" />
  </head>
  <body class="lab">
    <aside class="ui lab-panel">
      <h1>Lingerie lab</h1>
      <p class="lab-hint">Drag to turn the peach. Scroll to zoom.</p>

      <p class="lab-label">View</p>
      <div class="lab-choices" data-group="view">
        <button type="button" data-value="back">Back</button>
        <button type="button" data-value="quarter">Three-quarter</button>
        <button type="button" data-value="side">Side</button>
        <button type="button" data-value="spin">Spin</button>
      </div>

      <label class="lab-slider">
        <span>Pulled down <output data-for="pull"></output></span>
        <input type="range" data-key="pull" min="-0.45" max="1" step="0.01" />
      </label>
      <label class="lab-slider">
        <span>Rest tension <output data-for="rest"></output></span>
        <input type="range" data-key="rest" min="0" max="2" step="0.01" />
      </label>
      <label class="lab-slider">
        <span>Press in <output data-for="press"></output></span>
        <input type="range" data-key="press" min="0" max="2" step="0.01" />
      </label>
      <label class="lab-slider">
        <span>Bulge <output data-for="bulge"></output></span>
        <input type="range" data-key="bulge" min="0" max="2" step="0.01" />
      </label>
      <label class="lab-slider">
        <span>Bulge width <output data-for="width"></output></span>
        <input type="range" data-key="width" min="0.3" max="3" step="0.01" />
      </label>

      <div class="lab-actions">
        <button type="button" id="lab-copy">Copy values</button>
        <button type="button" id="lab-reset">Reset</button>
      </div>
      <pre id="lab-values" class="lab-values"></pre>
    </aside>

    <script type="module" src="lab.js"></script>
  </body>
</html>
