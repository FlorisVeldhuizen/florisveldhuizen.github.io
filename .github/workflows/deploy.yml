# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['deploy-actions']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The standalone peachy-keen repo is a copy of src/peachy-keen; Cloudflare deploys it on push.
  sync-peachy-keen:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clone the standalone repo
        env:
          DEPLOY_KEY: ${{ secrets.PEACHY_KEEN_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/peachy_keen
          chmod 600 ~/.ssh/peachy_keen
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/peachy_keen -o IdentitiesOnly=yes"
          git clone git@github.com:FlorisVeldhuizen/peachy-keen.git ../peachy-keen
          git -C ../peachy-keen config core.sshCommand "$GIT_SSH_COMMAND"
          git -C ../peachy-keen config user.name FlorisVeldhuizen
          git -C ../peachy-keen config user.email 10500846+FlorisVeldhuizen@users.noreply.github.com
      - name: Sync
        run: scripts/sync-peachy-keen.sh HEAD
